appId: br.com.tecpav.infrawork
productName: InfraWork
copyright: Copyright © 2026 TecPav Engenharia
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,RELEASE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/**'
  - '!supabase/**'
  - '!Formulario_Planejamento_*.xlsm'
  - '!notasdev.md'
  - '!icon-source.png'
  - '!logo-wordmark-glow.png'
asarUnpack:
  - resources/**
win:
  executableName: InfraWork
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
npmRebuild: false
publish:
  provider: github
  owner: rhuannpnx-byte
  repo: infrawork
  releaseType: draft
  vPrefixedTagName: true
